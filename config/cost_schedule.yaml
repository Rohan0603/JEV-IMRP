# Cost schedule (plan section 8.4): every statutory component calculated PER LEG,
# in rupees, before any normalisation to bps.
#
# VERIFICATION STATUS: the active draft below uses the public FYERS charges
# list and NSE statutory schedule accessed 2026-11-07. Contract-note parity,
# account-specific terms, and licensing/retention approval remain pending.
# Re-verify the whole schedule against the broker's then-current schedule and
# contract note before any execution-relevant test; the plan requires that check
# independently of this file.
cost_schedule_version: "v3-fyers-draft"
provider: "fyers"
currency: "INR"
basis: per_executed_leg
verified_at: "2026-11-07"
unverified_notice: "public FYERS/NSE rates checked 2026-11-07; IPFT/GST official-source conflict and contract-note parity unresolved"
fee_conflicts:
  status: "UNRESOLVED_OFFICIAL_SOURCE_CONFLICT"
  block_cost_sensitive_labels: true
  ipft:
    charges_list_rate_per_crore_inr: 0.01
    statutory_support_rate_per_crore_inr: 10.0
    sources:
      - "https://fyers.in/charges-list, accessed 2026-11-07"
      - "https://support.fyers.in/portal/en/kb/articles/what-are-the-statutory-charges-on-trades-at-fyers-stt-gst-sebi-turnover-fee-ipft-etc, accessed 2026-11-07"
  gst_taxable_base:
    charges_list_includes: [brokerage, exchange_transaction_fee, sebi_turnover_fee, ipft]
    statutory_support_includes: [brokerage, exchange_transaction_fee]
    resolution_required: "redacted contract note or written FYERS clarification"

# Rules that hold regardless of the numbers:
#   - fees are computed per executed leg (entry and exit separately);
#   - brokerage is NOT a constant bps rate: the Rs 20 cap makes the effective
#     rate notional-dependent, so both legs must be charged separately;
#   - stamp duty has a dual (lower-of) form and must be implemented as such;
#   - SEBI and IPFT are absolute per-cruore charges, not percentages;
#   - slippage/impact is modelled separately from statutory fees;
#   - net_pnl = signed_gross_pnl - sum(all components) - modelled slippage/impact.
#
# Segment caveat: the primary path is NSE cash equity. BSE equity transaction
# charge is 0.00183% per side and is recorded only for completeness; it must not
# be applied to an NSE instrument.

versions:
  - effective_from: "2026-11-07"
    effective_to: null          # open-ended; supersede with a dated entry when rates change
    components:

      brokerage:
        applies_to: equity_intraday
        type: percent_or_cap_lower_of
        percent: 0.03
        cap_per_order_inr: 20.00
        cap_rule: "min(percent * turnover, cap_per_order_inr)"
        per: executed_order
        source: "https://fyers.in/charges-list, accessed 2026-11-07"
        verification: "PUBLIC_RATE_CHECKED; contract-note parity pending"

      stt:
        applies_to: equity_intraday
        type: percent_of_turnover
        rate_pct: 0.025
        sides: [sell]           # intraday equity STT applies on the sell side only
        per: executed_order
        source: "https://fyers.in/charges-list, accessed 2026-11-07"
        verification: "PUBLIC_RATE_CHECKED; contract-note parity pending"

      exchange_transaction_fee_nse:
        applies_to: equity
        type: percent_of_turnover
        rate_pct: 0.0030699
        sides: [buy, sell]
        effective_from_note: "public FYERS/NSE rate checked 2026-11-07"
        per: executed_order
        source: "https://fyers.in/charges-list and https://www.nseindia.com/static/invest/first-time-investor-sebi-turnover-fees-stt-other-levies, accessed 2026-11-07"
        verification: "PUBLIC_RATE_CHECKED; effective-date and contract-note parity pending"

      exchange_transaction_fee_bse:
        applies_to: equity
        segment: BSE
        applies_to_this_research: false   # primary path is NSE; recorded for completeness only
        type: percent_of_turnover
        rate_pct: 0.00183
        sides: [buy, sell]
        per: executed_order
        source: "https://fyers.in/charges-list, accessed 2026-11-07"
        verification: "PUBLIC_RATE_CHECKED; contract-note parity pending"

      sebi_turnover_fee:
        applies_to: equity
        type: absolute_per_crore
        rate_per_crore_inr: 10
        sides: [buy, sell]
        crore_inr: 10000000
        per: executed_order
        source: "https://www.nseindia.com/static/invest/first-time-investor-sebi-turnover-fees-stt-other-levies, accessed 2026-11-07"
        verification: "PUBLIC_RATE_CHECKED; effective-date and contract-note parity pending"

      stamp_duty:
        applies_to: equity
        type: percent_or_absolute_lower_of
        percent: 0.003
        absolute_per_crore_inr: 300
        lower_of_rule: "min(percent * turnover, absolute_per_crore_inr * turnover / crore)"
        sides: [buy]
        per: executed_order
        source: "https://fyers.in/charges-list and https://www.nseindia.com/static/invest/first-time-investor-sebi-turnover-fees-stt-other-levies, accessed 2026-11-07"
        verification: "PUBLIC_RATE_CHECKED; effective-date and contract-note parity pending"

      gst:
        applies_to: equity
        type: percent_of_taxable_base
        rate_pct: 18
        taxable_base: [brokerage, sebi_turnover_fee, exchange_transaction_fee_nse, ipft_and_other_levies]
        taxable_base_note: >-
          FYERS public schedule states GST applies to brokerage, exchange,
          clearing, SEBI and NSE IPFT charges; clearing is zero for equity here.
        per: executed_order
        source: "https://fyers.in/charges-list, accessed 2026-11-07"
        verification: "UNRESOLVED_OFFICIAL_CONFLICT; contract-note parity pending"

      ipft_and_other_levies:
        applies_to: equity
        type: absolute_per_crore
        rate_per_crore_inr: 0.01
        basis: traded_value
        crore_inr: 10000000
        sides: [buy, sell]
        included_by_default: true
        gst_treatment: "included_in_public_fyers_gst_base"
        gst_treatment_note: >-
          Public FYERS charges list includes NSE IPFT in the GST base; confirm
          against the account's contract note before performance interpretation.
        per: executed_order
        source: "https://fyers.in/charges-list, accessed 2026-11-07"
        verification: "UNRESOLVED_OFFICIAL_CONFLICT; contract-note parity pending"

out_of_scope_notes:
  derivatives_stt_change_2026-04-01: >-
    On 2026-04-01 STT changed for futures and options (futures 0.05% on the sell
    side, options 0.15% on premium). Both are outside the scope of this project:
    the primary path is NSE cash-equity intraday, and plan 2.2 excludes
    derivatives. Recorded here so the dated change is not mistaken for a cash
    equity rate.

scenarios:
  - name: base
    description: "Broker charges plus conservative executable side prices and the chosen latency convention."
  - name: stress_1
    description: "Spread/slippage assumption increased by a predeclared amount or factor."
    increase_pct: null          # TBD - must be fixed before data inspection
  - name: stress_2
    description: "Greater latency and slippage, with occasional unfilled/failed-exit cases."
    latency_multiplier: null    # TBD - must be fixed before data inspection
    unfilled_exit_rate: null    # TBD - must be fixed before data inspection
