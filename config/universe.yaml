# Universe policy (plan section 2.3). Research-only.
#
# Provider-specific instrument identifiers are deliberately absent here. Active
# adapters resolve exact FYERS symbols from their dated masters; provider
# identifiers are never stored in the frozen research universe.
universe_version: "v1"
frozen_at_utc: "2026-10-17"
exchange: "NSE"
segment: "cash_equity"
instrument_type: "EQ"
lot_size_applicable: false          # cash equities trade in units, not lots
currency: "INR"
tick_size_inr: 0.05                  # NSE cash equity tick size; verify at go-live

eligibility_rule:
  mode: fixed_frozen
  description: >-
    Membership is frozen at the start of the prospective experiment. The first
    experiment therefore estimates performance on THIS fixed universe only; it
    does not estimate performance on the historical Nifty 50 or on the NSE as a
    whole. Retrospective reconstitution from today's constituents or today's
    liquidity ranks is forbidden.
  reconstitution: none_in_first_experiment
  exclusions:
    - symbol not tradeable in cash segment on every evaluated session
    - symbol suspended or in a trading halt for the whole session
    - provider mapping missing from the dated instrument master
  effective_dates:
    start: "2026-10-17"
    end: null                        # open-ended; set when membership is superseded
  source: "Sprint 0 selection by team; selection criteria recorded in PREREGISTRATION.md"

